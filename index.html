<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Showcase — Supercar Experience</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" />
  <style>
    :root {
      --bg-color: #0b0b0e;
      --text-main: #f4f4f6;
      --text-muted: #8e8e93;
      --accent: #d4af37;
      --glass-bg: rgba(20, 20, 25, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .editorial-header {
      position: absolute;
      top: 40px;
      left: 60px;
      z-index: 10;
      pointer-events: none;
    }
    .editorial-header h1 {
      font-weight: 300;
      font-size: 2.2rem;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }
    .editorial-header p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 6px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .view-controls {
      position: absolute;
      bottom: 40px;
      right: 60px;
      z-index: 10;
      display: flex;
      gap: 12px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      padding: 8px 16px;
      border-radius: 30px;
    }
    .view-controls button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 6px 12px;
      transition: color 0.3s ease;
    }
    .view-controls button.active, .view-controls button:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="editorial-header">
    <p>Exhibition 01</p>
    <h1>LaFerrari Aerodynamics</h1>
  </div>

  <div id="webgl-container"></div>

  <div class="view-controls">
    <button class="active" data-view="studio">Studio</button>
    <button data-view="profile">Profile</button>
    <button data-view="rear">Rear</button>
  </div>

  <!-- Include scripts -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
