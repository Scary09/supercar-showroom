<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supercar Showroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="loader-overlay" id="loader">
    <span class="eyebrow">Preparing Studio</span>
  </div>

  <main class="showroom-stage">
    <canvas id="webgl-canvas"></canvas>

    <header class="hud-top">
      <div class="brand-block">
        <span class="eyebrow">01 / Grand Tourer</span>
        <h1 class="car-title">V12 Berlinetta</h1>
      </div>
      <button class="editorial-btn" id="toggle-specs" type="button">Specifications +</button>
    </header>

    <footer class="hud-bottom">
      <nav class="camera-presets" aria-label="Camera views">
        <button class="preset-btn is-active" data-view="hero" type="button">Profile</button>
        <button class="preset-btn" data-view="front" type="button">Three-Quarter</button>
        <button class="preset-btn" data-view="rear" type="button">Rear</button>
      </nav>

      <div class="paint-swatches" role="group" aria-label="Exterior paint finish">
        <button class="swatch is-active" data-color="#1b1c1e" aria-label="Obsidian Black" type="button"></button>
        <button class="swatch" data-color="#8c2d23" aria-label="Rosso Corsa" type="button"></button>
        <button class="swatch" data-color="#d8d3c8" aria-label="Chalk Stone" type="button"></button>
      </div>
    </footer>

    <aside class="specs-drawer" id="specs-drawer" aria-hidden="true">
      <div class="drawer-header">
        <span class="eyebrow">Technical Sheet</span>
        <button class="editorial-btn" id="close-specs" type="button">Close —</button>
      </div>
      <dl class="specs-list">
        <div>
          <dt>Powertrain</dt>
          <dd>6.5L Naturally Aspirated V12</dd>
        </div>
        <div>
          <dt>Output</dt>
          <dd>800 CV @ 8,500 rpm</dd>
        </div>
        <div>
          <dt>0–100 km/h</dt>
          <dd>2.9 sec</dd>
        </div>
        <div>
          <dt>Top Speed</dt>
          <dd>340 km/h</dd>
        </div>
        <div>
          <dt>Dry Weight</dt>
          <dd>1,525 kg</dd>
        </div>
      </dl>
    </aside>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
