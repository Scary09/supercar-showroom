<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showroom — Minimalist Automotive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        obsidian: '#0a0a0a',
                        charcoal: '#171717',
                        subtle: '#262626',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 2px; }
    </style>
</head>
<body class="bg-obsidian text-neutral-100 antialiased selection:bg-neutral-100 selection:text-obsidian min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full px-8 py-6 flex justify-between items-center border-b border-neutral-900/80 backdrop-blur-md sticky top-0 z-50 bg-obsidian/80">
        <div class="tracking-widest text-xs uppercase font-semibold text-neutral-400">Atelier / Showroom</div>
        <nav class="hidden md:flex gap-8 text-xs tracking-wider uppercase text-neutral-400">
            <a href="#" class="text-neutral-100 transition-colors">Collection</a>
            <a href="#" class="hover:text-neutral-100 transition-colors">Specs</a>
            <a href="#" class="hover:text-neutral-100 transition-colors">Inquire</a>
        </nav>
        <div class="text-xs font-mono text-neutral-500">[ 2026 Edition ]</div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-6 lg:px-8 py-16 w-full grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
        
        <!-- Left: Details & Selection -->
        <div class="lg:col-span-5 flex flex-col justify-center space-y-8">
            <div class="space-y-3">
                <span id="car-tag" class="text-xs font-mono uppercase tracking-widest text-neutral-500">Loading...</span>
                <h1 id="car-title" class="text-4xl lg:text-5xl font-light tracking-tight text-white">Select a Model</h1>
                <p id="car-desc" class="text-sm text-neutral-400 leading-relaxed font-light">Explore our curated selection of high-performance engineering.</p>
            </div>

            <!-- Specs Grid -->
            <div class="grid grid-cols-3 gap-4 py-6 border-y border-neutral-900">
                <div>
                    <div class="text-[10px] uppercase font-mono text-neutral-500">Power</div>
                    <div id="spec-hp" class="text-lg font-medium text-neutral-200 mt-1">—</div>
                </div>
                <div>
                    <div class="text-[10px] uppercase font-mono text-neutral-500">0-100 km/h</div>
                    <div id="spec-accel" class="text-lg font-medium text-neutral-200 mt-1">—</div>
                </div>
                <div>
                    <div class="text-[10px] uppercase font-mono text-neutral-500">Top Speed</div>
                    <div id="spec-speed" class="text-lg font-medium text-neutral-200 mt-1">—</div>
                </div>
            </div>

            <!-- Thumbnails / Selector -->
            <div class="space-y-3">
                <div class="text-[10px] uppercase font-mono text-neutral-500">Available Editions</div>
                <div id="car-selector" class="flex gap-3 overflow-x-auto pb-2">
                    <!-- Dynamic buttons injected via JS -->
                </div>
            </div>
        </div>

        <!-- Right: Visual Showcase -->
        <div class="lg:col-span-7 flex justify-center items-center relative">
            <div class="w-full aspect-[16/10] bg-charcoal rounded-sm overflow-hidden relative border border-neutral-900 flex items-center justify-center group">
                <img id="car-image" src="" alt="Car Preview" class="w-full h-full object-cover opacity-90 transition-all duration-700 group-hover:scale-105">
                <div class="absolute inset-0 bg-gradient-to-t from-obsidian/40 via-transparent to-transparent"></div>
                <div class="absolute bottom-6 left-6 text-xs font-mono text-neutral-400 bg-obsidian/80 px-3 py-1.5 border border-neutral-800 backdrop-blur-sm">
                    Interactive Viewport
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full px-8 py-6 border-t border-neutral-900 flex flex-col sm:flex-row justify-between items-center text-xs text-neutral-500">
        <div>&copy; 2026 Supercar Showroom. All rights reserved.</div>
        <div class="flex gap-6 mt-4 sm:mt-0">
            <a href="#" class="hover:text-neutral-300">Privacy</a>
            <a href="#" class="hover:text-neutral-300">Terms</a>
            <a href="#" class="hover:text-neutral-300">Contact</a>
        </div>
    </footer>

    <!-- App Logic -->
    <script>
        let carsData = [];

        async function initShowroom() {
            try {
                const response = await fetch('./public/data/cars.json');
                carsData = await response.json();
                if (carsData.length > 0) {
                    renderCar(carsData[0]);
                    renderSelector();
                }
            } catch (err) {
                console.error('Failed to load showroom data:', err);
                document.getElementById('car-title').innerText = 'Data Loading Error';
                document.getElementById('car-desc').innerText = 'Please verify that public/data/cars.json is accessible.';
            }
        }

        function renderCar(car) {
            document.getElementById('car-tag').innerText = car.tag || 'Exotic Series';
            document.getElementById('car-title').innerText = car.name;
            document.getElementById('car-desc').innerText = car.description;
            document.getElementById('spec-hp').innerText = car.specs.hp;
            document.getElementById('spec-accel').innerText = car.specs.acceleration;
            document.getElementById('spec-speed').innerText = car.specs.topSpeed;
            document.getElementById('car-image').src = car.image;
            document.getElementById('car-image').alt = car.name;
        }

        function renderSelector() {
            const selector = document.getElementById('car-selector');
            selector.innerHTML = '';
            carsData.forEach((car, index) => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-2.5 text-xs font-mono border rounded-sm transition-all text-left whitespace-nowrap ${index === 0 ? 'border-neutral-100 text-neutral-100 bg-neutral-900' : 'border-neutral-800 text-neutral-400 hover:border-neutral-600'}`;
                btn.innerText = car.name;
                btn.onclick = () => {
                    document.querySelectorAll('#car-selector button').forEach(b => {
                        b.className = 'px-4 py-2.5 text-xs font-mono border rounded-sm transition-all text-left whitespace-nowrap border-neutral-800 text-neutral-400 hover:border-neutral-600';
                    });
                    btn.className = 'px-4 py-2.5 text-xs font-mono border rounded-sm transition-all text-left whitespace-nowrap border-neutral-100 text-neutral-100 bg-neutral-900';
                    renderCar(car);
                };
                selector.appendChild(btn);
            });
        }

        window.addEventListener('DOMContentLoaded', initShowroom);
    </script>
</body>
</html>
